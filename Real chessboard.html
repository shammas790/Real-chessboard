<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Chess Master Pro</title>
    <style>
        :root {
            --primary: #1e293b;
            --secondary: #334155;
            --accent: #0284c7;
            --accent-glow: rgba(2, 132, 199, 0.4);
            --hint-from: #f59e0b;
            --hint-to: #10b981;
            --bg: #090d16;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --panel-border: rgba(71, 85, 105, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            /* Classic Wood Board Theme */
            --light-square: #f0d9b5;
            --dark-square: #b58863;
        }

        /* Midnight Shadows Theme Override */
        body.theme-midnight {
            --light-square: #475569;
            --dark-square: #1e293b;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --bg: #030712;
            --panel-bg: rgba(17, 24, 39, 0.7);
        }

        /* Cyber Neon Glow Theme Override */
        body.theme-cyber {
            --light-square: #1e1b4b;
            --dark-square: #311042;
            --accent: #d946ef;
            --accent-glow: rgba(217, 70, 239, 0.4);
            --bg: #05020a;
            --panel-bg: rgba(15, 10, 28, 0.75);
            --panel-border: rgba(217, 70, 239, 0.2);
        }

        /* --- GENERAL RESET & LAYOUT --- */
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(2, 132, 199, 0.15), transparent 50%);
            color: var(--text-main);
            margin: 0;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.theme-cyber {
            background-image: radial-gradient(circle at 50% 0%, rgba(217, 70, 239, 0.15), transparent 50%);
        }

        h1, h2, h3 { letter-spacing: -0.025em; }

        h1 {
            color: #ffffff;
            margin: 0 0 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1.75rem;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* --- SCREEN INTERFACE PANELS (Glassmorphism) --- */
        #homeScreen, #gameScreen, #settingsScreen {
            display: none;
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            animation: panelSlideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #homeScreen { display: block; }

        @keyframes panelSlideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .panel-card {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 30px 24px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid var(--panel-border);
        }

        .home-header { text-align: center; margin-bottom: 10px;}
        .home-icon {
            font-size: 4.5rem;
            margin-bottom: 5px;
            display: inline-block;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
            animation: crownFloat 4s ease-in-out infinite;
        }

        @keyframes crownFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        .sidebar-tutorial {
            background: rgba(15, 23, 42, 0.6);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin: 15px 0 20px 0;
            max-height: 140px;
            overflow-y: auto;
        }
        .sidebar-tutorial::-webkit-scrollbar { width: 6px; }
        .sidebar-tutorial::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 10px; }

        .tutorial-section { border-bottom: 1px solid rgba(255, 255, 255, 0.06); padding-bottom: 8px; margin-bottom: 8px; }
        .tutorial-section:last-child { border: none; padding-bottom: 0; margin-bottom: 0; }
        .sidebar-tutorial h2 { color: #ffffff; font-size: 1.15rem; margin-top:0; margin-bottom: 8px; }
        .sidebar-tutorial h3 { color: var(--accent); font-size: 0.95rem; margin-top: 0; }
        .sidebar-tutorial p { color: var(--text-muted); font-size: 0.85rem; line-height: 1.5; }

        .value-badge {
            background: rgba(255, 255, 255, 0.08); color: #f59e0b; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600;
        }

        /* --- PREMIUM BUTTON DESIGN SYSTEM --- */
        .menu-buttons { display: flex; flex-direction: column; gap: 12px; }
        .menu-btn {
            padding: 15px; font-size: 1rem; border: none; border-radius: 14px;
            background-color: var(--accent); color: white; cursor: pointer; font-weight: 600;
            box-shadow: 0 4px 15px var(--accent-glow); transition: all 0.2s ease;
        }
        .menu-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .ai-btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .ai-btn {
            padding: 14px; font-size: 0.95rem; border: none; border-radius: 12px; color: white; cursor: pointer; font-weight: 600; transition: all 0.2s ease;
        }
        .ai-beginner { background: linear-gradient(135deg, #10b981, #059669); }
        .ai-easy { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .ai-normal { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .ai-hard { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .ai-btn:hover { transform: translateY(-2px); filter: brightness(1.15); }

        /* --- THE CHESSBOARD --- */
        .board-container {
            width: 100%; aspect-ratio: 1/1; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
            border: 6px solid #1e293b; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.65); overflow: hidden; margin-bottom: 16px;
        }
        body.theme-cyber .board-container { border-color: #150a21; box-shadow: 0 0 30px rgba(217, 70, 239, 0.25); }

        .square { display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .light { background-color: var(--light-square); }
        .dark { background-color: var(--dark-square); }

        .square.selected::after {
            content: ''; position: absolute; width: 100%; height: 100%; background-color: rgba(56, 189, 248, 0.35); box-shadow: inset 0 0 12px #38bdf8; z-index: 3;
        }
        .square.legal-dest::before {
            content: ''; position: absolute; width: 16px; height: 16px; background-color: rgba(2, 132, 199, 0.75); border: 2px solid #ffffff; border-radius: 50%; z-index: 5;
        }
        .square.hint-from-square::after {
            content: ''; position: absolute; width: 100%; height: 100%; background-color: rgba(245, 158, 11, 0.3); box-shadow: inset 0 0 15px var(--hint-from); z-index: 3;
        }
        .square.hint-to-square::after {
            content: ''; position: absolute; width: 100%; height: 100%; background-color: rgba(16, 185, 129, 0.35); box-shadow: inset 0 0 20px var(--hint-to); z-index: 3;
        }

        .piece-svg { width: 88%; height: 88%; object-fit: contain; z-index: 2; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.35)); }

        .status-box {
            margin-bottom: 14px; padding: 14px; background: rgba(30, 41, 59, 0.8); border-radius: 14px; border-left: 5px solid var(--accent); font-weight: 600; text-align: center; color: #f1f5f9;
        }

        .controls-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .controls-triple { display: grid; grid-template-columns: 1.5fr 1fr 0.7fr; gap: 12px; }

        button.game-btn {
            padding: 12px 8px; border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; background: #1e293b; color: #f8fafc; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        button.game-btn:hover:not(:disabled) { background: #334155; }
        button.game-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        #hintBtn { background: linear-gradient(135deg, #10b981, #059669); color: #ffffff; }

        /* --- SETTINGS MENU ELEMENTS --- */
        .settings-scroll-box { max-height: 400px; overflow-y: auto; padding-right: 4px; }
        .settings-scroll-box::-webkit-scrollbar { width: 6px; }
        .settings-scroll-box::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }

        .settings-row { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
        .settings-row label { font-weight: 600; color: #e2e8f0; font-size: 0.95rem; }
        .settings-row select {
            width: 100%; padding: 11px; background: #0f172a; border: 1px solid #475569; border-radius: 12px; color: white; font-size: 0.95rem; outline: none;
        }
        .settings-row input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 5px; background: #475569; }
        .settings-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); cursor: pointer; }

        .checkbox-label { display: flex; align-items: center; gap: 12px; cursor: pointer; font-weight: 500; color: #cbd5e1; }
        .checkbox-label input {
            appearance: none; -webkit-appearance: none; width: 20px; height: 20px; border: 2px solid #475569; border-radius: 6px; background: #0f172a; cursor: pointer; display: inline-grid; place-content: center;
        }
        .checkbox-label input:checked { background: var(--accent); border-color: var(--accent); }
        .checkbox-label input:checked::before { content: "✓"; color: white; font-size: 0.85rem; font-weight: bold; }
    </style>
</head>
<body class="theme-classic">

    <!-- 1. HOME SCREEN MENU -->
    <div id="homeScreen" class="panel-card">
        <div style="position: absolute; right: 20px; top: 20px;">
            <button class="game-btn" onclick="openSettings('home')" style="padding: 8px 12px; border-radius: 50%;">⚙️</button>
        </div>
        <div class="home-header">
            <div class="home-icon">👑</div>
            <h1>Chess Master</h1>
        </div>

        <div class="sidebar-tutorial">
            <h2>🎓 Quick Info</h2>
            <div class="tutorial-section">
                <h3>👑 Checkmate</h3>
                <p>Trap the enemy King under attack with no legal escape squares to win the match.</p>
            </div>
        </div>
        
        <div class="menu-buttons">
            <button class="menu-btn" style="background-color: #475569;" onclick="startChessGame('pvp')">👥 Player vs Player</button>
            <div style="text-align: center; color: #94a3b8; font-weight: bold; margin: 3px 0;">🤖 Play vs AI Bot Options:</div>
            <div class="ai-btn-group">
                <button class="ai-btn ai-beginner" onclick="startChessGame('ai', 'beginner')">Beginner</button>
                <button class="ai-btn ai-easy" onclick="startChessGame('ai', 'easy')">Easy</button>
                <button class="ai-btn ai-normal" onclick="startChessGame('ai', 'normal')">Normal</button>
                <button class="ai-btn ai-hard" onclick="startChessGame('ai', 'hard')">Hard</button>
            </div>
        </div>
    </div>

    <!-- 2. GAME SCREEN INTERFACE -->
    <div id="gameScreen">
        <h1 style="margin-bottom: 15px;">
            <span id="modeIcon">🤖</span> <span id="modeTitle">Chess Match</span>
        </h1>
        
        <div class="board-container" id="board"></div>
        <div class="status-box" id="status">White's Turn</div>
        
        <div class="controls-row">
            <button class="game-btn" id="undoBtn" onclick="handleUndo()">⬅️ Undo</button>
            <button class="game-btn" id="redoBtn" onclick="handleRedo()">Redo ➡️</button>
        </div>

        <div class="controls-triple">
            <button class="game-btn" id="hintBtn" onclick="giveHint()">⚔️ Win Hint</button>
            <button class="game-btn" onclick="resetGame()">🔄 Restart</button>
            <button class="game-btn" onclick="openSettings('game')" style="background-color: #475569;">⚙️</button>
        </div>
    </div>

    <!-- 3. CONFIGURABLE SETTINGS PANEL -->
    <div id="settingsScreen" class="panel-card">
        <h2>⚙️ App Configurations</h2>
        
        <div class="settings-scroll-box">
            <!-- Setting 1: Board Visual Themes -->
            <div class="settings-row">
                <label for="themeSelect">🎨 Board Style Palette</label>
                <select id="themeSelect" onchange="applyVisualTheme(this.value)">
                    <option value="classic">Classic Wood Accent</option>
                    <option value="midnight">Midnight Shadows</option>
                    <option value="cyber">Cyber Neon Glow</option>
                </select>
            </div>

            <!-- New Setting 2: Piece Style Set -->
            <div class="settings-row">
                <label for="pieceSetSelect">♟️ Piece Artwork Type</label>
                <select id="pieceSetSelect" onchange="changePieceSet(this.value)">
                    <option value="classic">Classic Stylized Shapes</option>
                    <option value="modern">Modern Minimalist Lineart</option>
                </select>
            </div>

            <!-- Setting 3: Tactical Engine Depth Adjuster -->
            <div class="settings-row">
                <label id="depthLabel" for="hintDepthRange">🧠 Hint Lookahead Depth: 2 Moves</label>
                <input type="range" id="hintDepthRange" min="1" max="4" value="2" step="1" oninput="updateHintDepthDisplay(this.value)">
            </div>

            <!-- New Setting 4: AI Thinking Delay Simulator -->
            <div class="settings-row">
                <label for="aiDelaySelect">⚡ AI Processing Delay Speed</label>
                <select id="aiDelaySelect">
                    <option value="100">Instantaneous (100ms)</option>
                    <option value="500" selected>Standard Natural (500ms)</option>
                    <option value="1200">Calculated Strategy (1.2s)</option>
                </select>
            </div>

            <!-- Setting 5: Audio Control Layer -->
            <div class="settings-row">
                <label for="volumeRange">🔊 System Sound Volume</label>
                <input type="range" id="volumeRange" min="0" max="1" value="0.5" step="0.1">
                <div style="margin-top: 6px;">
                    <label class="checkbox-label">
                        <input type="checkbox" id="muteToggle"> 🔇 Totally Mute All Sounds
                    </label>
                </div>
            </div>

            <!-- Setting 6: Interface Helpers Toggle -->
            <div class="settings-row">
                <label class="checkbox-label">
                    <input type="checkbox" id="legalMovesToggle" checked onchange="renderBoard()"> 🔵 Show Possible Destination Dots
                </label>
            </div>

            <!-- New Setting 7: Win Warning Notification Engine -->
            <div class="settings-row">
                <label class="checkbox-label">
                    <input type="checkbox" id="winNoticeToggle" checked> ⚠️ Flash Warnings on Check
                </label>
            </div>
        </div>

        <hr style="border: none; border-top: 1px solid #475569; margin: 15px 0;">
        <button class="menu-btn" style="width: 100%;" onclick="closeSettings()">💾 Save & Return</button>
    </div>

    <!-- Rules Engine Layer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        let game = new Chess();
        let gameMode = 'ai'; 
        let aiDifficulty = 'beginner'; 
        let selectedSquare = null;
        
        let smartHintFrom = null;
        let smartHintTo = null;
        let hintSearchDepth = 2; 
        let settingsReturnTarget = 'home'; 
        let currentPieceStyle = 'classic';
        
        let legalDestinations = [];
        let moveHistoryStack = [];
        let redoHistoryStack = [];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (document.getElementById('muteToggle').checked) return;
            const globalVol = parseFloat(document.getElementById('volumeRange').value);
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'select') {
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime); gain.gain.setValueAtTime(0.05 * globalVol, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08); osc.start(); osc.stop(audioCtx.currentTime + 0.08);
                } else if (type === 'move') {
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime); gain.gain.setValueAtTime(0.1 * globalVol, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'capture') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(250, audioCtx.currentTime); gain.gain.setValueAtTime(0.15 * globalVol, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15); osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                }
            } catch (e) {}
        }

            'bq': `<svg viewBox="0 0 45 45" class="piece-svg"><path d="M8 12a2 2 0 1 1-4 0 2 2 0 1 1 4 0zm6-4a2 2 0 1 1-4 0 2 2 0 1 1 4 0zm8-2a2 2 0 1 1-4 0 2 2 0 1 1 4 0zm8 2a2 2 0 1 1-4 0 2 2 0 1 1 4 0zm6 4a2 2 0 1 1-4 0 2 2 0 1 1 4 0zm-1 29H10V33h25v4zm-3-5H13l-3-15 7 4 5-10 5 10 7-4-3 15z" fill="#454545" stroke="#fff" stroke-width="1.5"/></svg>`,

        };

        const modernPieces = {
            'wp': `<svg viewBox="0 0 24 24" class="piece-svg" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="7" r="3"/><path d="M12 10v9M9 19h6" stroke-linecap="round"/></svg>`,

            'wn': `<svg viewBox="0 0 24 24" class="piece-svg" fill="none" stroke="#fff" stroke-width="2"><path d="M18 20c0-4-3-6-6-6h-1V9l3-3H9v5l-3 4v4h13z" stroke-linecap="round"/></svg>`,
            'wb': `<svg viewBox="0 0 24 24" class="piece-svg" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="9" r="4"/><path d="M12 5v2M12 13v7M8 20h8" stroke-linecap="round"/></svg>`,
            'wq': `<svg viewBox="0 0 24 24" class="piece-svg" fill="none" stroke="#fff" stroke-width="2"><path d="M12 4l3 7h5l-4 4 2 6-6-4-6 4 2-6-4-4h5l3-7z" stroke-linejoin="round"/></svg>`,
            'wk': `<svg viewBox="0 0 24 24" class="piece-svg" fill="none" stroke="#fff" stroke-width="2"><path d="M12 4v16M8 20h8M9 7h6M5 11h14" stroke-linecap="round"/></svg>`,
            'bp': `<svg viewBox="0 0 24 24" class="piece-svg" fill="none" stroke="#a7f3d0" stroke-width="2"><circle cx="12" cy="7" r="3" fill="#047857"/><path d="M12 10v9M9 19h6" stroke-linecap="round"/></svg>`,
            'br': `<svg viewBox="0 0 24 24" class="piece-svg" fill="none" stroke="#a7f3d0" stroke-width="2"><path d="M5 20h14V9H5v11z" fill="#047857"/><path d="M5 9l2-3h10l2 3M9 9V6M15 9V6" stroke-linecap="round"/></svg>`,
            'bn': `<svg viewBox="0 0 24 24" class="piece-svg" fill="none" stroke="#a7f3d0" stroke-width="2"><path d="M18 20c0-4-3-6-6-6h-1V9l3-3H9v5l-3 4v4h13z" fill="#047857" stroke-linecap="round"/></svg>`,
            'bb': `<svg viewBox="0 0 24 24" class="piece-svg" fill="none" stroke="#a7f3d0" stroke-width="2"><circle cx="12" cy="9" r="4" fill="#047857"/><path d="M12 5v2M12 13v7M8 20h8" stroke-linecap="round"/></svg>`,
            'bq': `<svg viewBox="0 0 24 24" class="piece-svg" fill="none" stroke="#a7f3d0" stroke-width="2"><path d="M12 4l3 7h5l-4 4 2 6-6-4-6 4 2-6-4-4h5l3-7z" fill="#047857" stroke-linejoin="round"/></svg>`,
            'bk': `<svg viewBox="0 0 24 24" class="piece-svg" fill="none" stroke="#a7f3d0" stroke-width="2"><path d="M12 4v16M8 20h8M9 7h6M5 11h14" fill="#047857" stroke-linecap="round"/></svg>`
        };

        function getActiveSet() { return currentPieceStyle === 'classic' ? classicPieces : modernPieces; }

        /* --- DISPLAY NAVIGATION SYSTEM --- */
        function startChessGame(mode, difficulty = 'beginner') {
            gameMode = mode; aiDifficulty = difficulty;
            document.getElementById('modeIcon').innerText = mode === 'ai' ? '🤖' : '👥';
            document.getElementById('modeTitle').innerText = mode === 'ai' ? `vs AI (${difficulty.toUpperCase()})` : 'Player vs Player';
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            resetGame();
        }

        function openSettings(fromScreen) {
            settingsReturnTarget = fromScreen;
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('settingsScreen').style.display = 'block';
        }

        function closeSettings() {
            document.getElementById('settingsScreen').style.display = 'none';
            if (settingsReturnTarget === 'game') {
                document.getElementById('gameScreen').style.display = 'block';
            } else {
                document.getElementById('homeScreen').style.display = 'block';
            }
        }

        /* --- ACTION TRIGGERS FOR SETTINGS --- */
        function applyVisualTheme(theme) {
            document.body.className = ''; 
            if (theme === 'midnight') document.body.classList.add('theme-midnight');
            if (theme === 'cyber') document.body.classList.add('theme-cyber');
        }

        function changePieceSet(val) {
            currentPieceStyle = val;
            renderBoard();
        }

        function updateHintDepthDisplay(val) {
            hintSearchDepth = parseInt(val);
            document.getElementById('depthLabel').innerText = `🧠 Hint Lookahead Depth: ${val} Moves`;
        }

        /* --- CHESS BOARD CORE LOGIC --- */
        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            const boardState = game.board();
            const showLegalDots = document.getElementById('legalMovesToggle').checked;
            const pieceAssortment = getActiveSet();
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareDiv = document.createElement('div');
                    const squareName = String.fromCharCode(97 + c) + (8 - r);
                    
                    squareDiv.classList.add('square', (r + c) % 2 === 0 ? 'light' : 'dark');
                    squareDiv.dataset.square = squareName;

                    if (selectedSquare === squareName) squareDiv.classList.add('selected');
                    if (showLegalDots && legalDestinations.includes(squareName)) squareDiv.classList.add('legal-dest');
                    if (smartHintFrom === squareName) squareDiv.classList.add('hint-from-square');
                    if (smartHintTo === squareName) squareDiv.classList.add('hint-to-square');

                    const piece = boardState[r][c];
                    if (piece) {
                        squareDiv.innerHTML = pieceAssortment[piece.color + piece.type];
                    }

                    squareDiv.addEventListener('click', () => handleSquareClick(squareName));
                    boardElement.appendChild(squareDiv);
                }
            }
            document.getElementById('undoBtn').disabled = (moveHistoryStack.length === 0);
            document.getElementById('redoBtn').disabled = (redoHistoryStack.length === 0);
        }

        function handleSquareClick(square) {
            if (game.game_over() || (gameMode === 'ai' && game.turn() === 'b')) return;
            clearHints();

            if (selectedSquare === square) {
                selectedSquare = null; legalDestinations = []; renderBoard(); return;
            }

            if (selectedSquare) {
                const currentFen = game.fen();
                const isCapture = game.get(square) !== null;
                const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });

                if (move === null) {
                    const pieceOnTarget = game.get(square);
                    if (pieceOnTarget && pieceOnTarget.color === game.turn()) {
                        selectedSquare = square; playSound('select');
                        legalDestinations = game.moves({ square: square, verbose: true }).map(m => m.to);
                    } else {
                        selectedSquare = null; legalDestinations = [];
                    }
                } else {
                    moveHistoryStack.push(currentFen); redoHistoryStack = [];
                    selectedSquare = null; legalDestinations = [];
                    playSound(isCapture ? 'capture' : 'move');
                    renderBoard(); updateStatus();

                    if (gameMode === 'ai' && !game.game_over()) {
                        const artificialDelay = parseInt(document.getElementById('aiDelaySelect').value);
                        setTimeout(triggerAIMove, artificialDelay);
                    }
                    return;
                }
            } else {
                const pieceOnSquare = game.get(square);
                if (pieceOnSquare && pieceOnSquare.color === game.turn()) {
                    selectedSquare = square; playSound('select');
                    legalDestinations = game.moves({ square: square, verbose: true }).map(m => m.to);
                }
            }
            renderBoard();
        }

        function triggerAIMove() {
            const moves = game.moves();
            if (moves.length === 0) return;
            const currentFen = game.fen();
            let chosenMove = moves[0];

            if (aiDifficulty === 'beginner') { chosenMove = moves[Math.floor(Math.random() * moves.length)]; }
            else if (aiDifficulty === 'easy') { chosenMove = minimaxDecision(1); }
            else if (aiDifficulty === 'normal') { chosenMove = minimaxDecision(2); }
            else if (aiDifficulty === 'hard') { chosenMove = minimaxDecision(3); }

            const targetSquare = game.move(chosenMove).to;
            moveHistoryStack.push(currentFen);
            playSound(game.get(targetSquare) !== null ? 'capture' : 'move');
            renderBoard(); updateStatus();
        }

        const pieceValues = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };

        function evaluateBoardState() {
            if (game.in_checkmate()) return game.turn() === 'w' ? -100000 : 100000;
            if (game.in_draw()) return 0;
            let score = 0; const board = game.board();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (piece) { score += (piece.color === 'w' ? pieceValues[piece.type] : -pieceValues[piece.type]); }
                }
            }
            return score;
        }

        function minimaxDecision(depth) {
            const moves = game.moves({ verbose: true });
            let bestMove = moves[Math.floor(Math.random() * moves.length)], bestValue = Infinity;
            for (let i = 0; i < moves.length; i++) {
                game.move(moves[i].san); let value = alphaBeta(depth - 1, -Infinity, Infinity, true); game.undo();
                if (value < bestValue) { bestValue = value; bestMove = moves[i]; }
            }
            return bestMove.san;
        }

        function alphaBeta(depth, alpha, beta, isMaximizing) {
            if (depth === 0 || game.game_over()) return evaluateBoardState();
            const moves = game.moves();
            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let i = 0; i < moves.length; i++) {
                    game.move(moves[i]); let score = alphaBeta(depth - 1, alpha, beta, false); game.undo();
                    maxEval = Math.max(maxEval, score); alpha = Math.max(alpha, score); if (beta <= alpha) break;
                } return maxEval;
            } else {
                let minEval = Infinity;
                for (let i = 0; i < moves.length; i++) {
                    game.move(moves[i]); let score = alphaBeta(depth - 1, alpha, beta, true); game.undo();
                    minEval = Math.min(minEval, score); beta = Math.min(beta, score); if (beta <= alpha) break;
                } return minEval;
            }
        }

        function handleUndo() {
            if (moveHistoryStack.length === 0) return; clearHints(); legalDestinations = [];
            if (gameMode === 'ai' && moveHistoryStack.length >= 2) {
                redoHistoryStack.push(game.fen()); game.load(moveHistoryStack.pop());
                redoHistoryStack.push(game.fen()); game.load(moveHistoryStack.pop());
            } else if (gameMode !== 'ai') {
                redoHistoryStack.push(game.fen()); game.load(moveHistoryStack.pop());
            }
            selectedSquare = null; renderBoard(); updateStatus();
        }

        function handleRedo() {
            if (redoHistoryStack.length === 0) return; clearHints(); legalDestinations = [];
            if (gameMode === 'ai' && redoHistoryStack.length >= 2) {
                moveHistoryStack.push(game.fen()); game.load(redoHistoryStack.pop());
                moveHistoryStack.push(game.fen()); game.load(redoHistoryStack.pop());
            } else if (gameMode !== 'ai') {
                moveHistoryStack.push(game.fen()); game.load(redoHistoryStack.pop());
            }
            selectedSquare = null; renderBoard(); updateStatus();
        }

        function giveHint() {
            clearHints(); if (game.game_over()) return;
            const moves = game.moves({ verbose: true }); if (moves.length === 0) return;
            const activePlayer = game.turn(); let bestMove = moves[0];

            for (let i = 0; i < moves.length; i++) {
                game.move(moves[i].san);
                if (game.in_checkmate()) {
                    smartHintFrom = moves[i].from; smartHintTo = moves[i].to; game.undo(); renderBoard(); return;
                } game.undo();
            }

            const customDepth = hintSearchDepth - 1;
            if (activePlayer === 'w') {
                let maximumScore = -Infinity;
                for (let i = 0; i < moves.length; i++) {
                    game.move(moves[i].san); let score = alphaBeta(customDepth, -Infinity, Infinity, false); game.undo();
                    if (score > maximumScore) { maximumScore = score; bestMove = moves[i]; }
                }
            } else {
                let minimumScore = Infinity;
                for (let i = 0; i < moves.length; i++) {
                    game.move(moves[i].san); let score = alphaBeta(customDepth, -Infinity, Infinity, true); game.undo();
                    if (score < minimumScore) { minimumScore = score; bestMove = moves[i]; }
                }
            }
            smartHintFrom = bestMove.from; smartHintTo = bestMove.to; renderBoard();
        }

        function clearHints() { smartHintFrom = null; smartHintTo = null; }

        function updateStatus() {
            const statusEl = document.getElementById('status');
            const flashWarnings = document.getElementById('winNoticeToggle').checked;
            let turnColor = game.turn() === 'w' ? 'White' : 'Black';

            if (game.in_checkmate()) {
                statusEl.innerText = `💥 Game Over! ${turnColor} is in checkmate.`;
                if (flashWarnings) alert(`Match Concluded: ${turnColor} defeated by checkmate!`);
            } else if (game.in_draw()) {
                statusEl.innerText = '🤝 Game Over! It\'s a draw.';
            } else {
                statusEl.innerText = `${turnColor}'s Turn` + (game.in_check() ? ' (⚠️ In Check!)' : '');
                if (game.in_check() && flashWarnings) {
                    statusEl.style.backgroundColor = "rgba(239, 68, 68, 0.25)";
                    setTimeout(() => statusEl.style.backgroundColor = "", 600);
                }
            }
        }

        function resetGame() {
            game.reset(); selectedSquare = null; moveHistoryStack = []; redoHistoryStack = []; clearHints(); legalDestinations = []; renderBoard(); updateStatus();
        }
    </script>
</body>

<style>:root {

}

body.theme-cyber {
    --light-square: #1e1b4b;

    --accent-glow: rgba(217, 70, 239, 0.4);

    --panel-bg: rgba(15, 10, 28, 0.75);
    --panel-border: rgba(217, 70, 239, 0.2);
}

/* --- GENERAL RESET & LAYOUT --- */
body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background-color: var(--bg);
    background-image: radial-gradient(circle at 50% 0%, rgba(2, 132, 199, 0.15), transparent 50%);
    color: var(--text-main);
    margin: 0;
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

body.theme-cyber {
    background-image: radial-gradient(circle at 50% 0%, rgba(217, 70, 239, 0.15), transparent 50%);
}

h1, h2, h3 {
    letter-spacing: -0.025em;
}

h1 {
    color: #ffffff;
    margin: 0 0 15px 0;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 1.75rem;
    font-weight: 700;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);

/* --- SCREEN INTERFACE PANELS (Glassmorphism) --- */
#homeScreen, #gameScreen, #settingsScreen {
    display: none;

    max-width: 440px;

    animation: panelSlideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

#homeScreen { display: block; }

.panel-card {

    -webkit-backdrop-filter: blur(16px);
    padding: 30px 24px;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
    border: 1px solid var(--panel-border);
}

.home-header {

}

/* --- PREMIUM BUTTON DESIGN SYSTEM --- */
.menu-buttons { display: flex; flex-direction: column; gap: 12px; }

.ai-btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.ai-beginner { background: linear-gradient(135deg, #10b981, #059669); }
.ai-easy { background: linear-gradient(135deg, #f59e0b, #d97706); }

.ai-btn:hover {

    filter: brightness(1.15);
    box-shadow: 0 6px 14px rgba(0,0,0,0.3);

.ai-btn:active { transform: translateY(0); }

/* --- THE CHESSBOARD (ENGINE CORE) --- */
.board-container {
    width: 100%;
    aspect-ratio: 1/1;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    border: 6px solid #1e293b;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.65);
    user-select: none;
    touch-action: none;
    overflow: hidden;
    margin-bottom: 16px;
    transition: border-color 0.4s ease;
}
body.theme-midnight .board-container { border-color: #0f172a; }
body.theme-cyber .board-container { border-color: #150a21; box-shadow: 0 0 30px rgba(217, 70, 239, 0.25); }

.square { 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    position: relative; 
    cursor: pointer;
}
.light { background-color: var(--light-square); transition: background-color 0.4s ease; }
.dark { background-color: var(--dark-square); transition: background-color 0.4s ease; }

/* Interactive Board States */
.square.selected::after {
    content: ''; position: absolute; width: 100%; height: 100%; 
    background-color: rgba(56, 189, 248, 0.35);
    box-shadow: inset 0 0 12px #38bdf8;
    pointer-events: none; z-index: 3;
}

.square.legal-dest::before {
    content: ''; position: absolute; width: 16px; height: 16px; 
    background-color: rgba(2, 132, 199, 0.75);
